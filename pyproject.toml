[project]
name = "qualitative-coding"
version = "2.0.1"
description = "Qualitative coding tools to support computational thinking"
authors = [
    {name = "Chris Proctor",email = "chris@chrisproctor.net"}
]
license = {text = "AGPL3"}
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "tqdm>=4.67.1,<5.0.0",
    "tabulate>=0.9.0,<0.10.0",
    "numpy>=2.2.1,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "click>=8.1.8,<9.0.0",
    "sqlalchemy>=2.0.37,<3.0.0",
    "semver>=3.0.2,<4.0.0",
    "xmlschema>=3.4.3,<4.0.0",
    "structlog>=25.1.0,<26.0.0",
    "rich>=13.9.4,<14.0.0",
    "more-itertools>=10.6.0,<11.0.0",
    "webvtt-py>=0.5.1,<0.6.0",
    "spacy>=3.8.7,<4.0.0",
    "scikit-learn>=1.6,<2",
    "openai>=1.0,<2",
    "krippendorff>=0.6,<1",
]

[project.urls]
homepage = "https://qualitative-coding.readthedocs.io"
repository = "https://github.com/cproctor/qualitative-coding"

[project.scripts]
qc = "qualitative_coding.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qualitative_coding"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
docs = [
    "sphinx>=7.3.7,<8",
    "sphinx-rtd-theme>=2.0.0,<3",
]
